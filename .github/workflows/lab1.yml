name: lab1-ci-cd

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write # required to request the OIDC token
  contents: read

env:
  ARM_USE_OIDC: "true"
  ARM_USE_AZUREAD: "true"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}

jobs:
  # ---------- CI: fast checks, no Azure login needed ----------
  ci:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Format check
        run: terraform fmt -check -recursive
      - name: Init (no backend)
        run: terraform init -backend=false
      - name: Validate
        run: terraform validate

  # ---------- Pull request only: preview the change ----------
  plan:
    if: github.event_name == 'pull_request'
    needs: ci
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
      - name: Init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}"
          -backend-config="container_name=tfstate"
      - name: Plan
        run: terraform plan -input=false

  # ---------- Main branch only: approval, then deploy ----------
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: ci
    runs-on: ubuntu-latest
    environment: production # approval gate happens here
    defaults:
      run:
        working-directory: infra
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_wrapper: false # so 'terraform output -raw' returns clean text
      - name: Init
        run: >
          terraform init
          -backend-config="resource_group_name=${{ vars.TFSTATE_RG }}"
          -backend-config="storage_account_name=${{ vars.TFSTATE_SA }}"
          -backend-config="container_name=tfstate"
      - name: Apply
        run: terraform apply -auto-approve -input=false
      - name: Read outputs
        id: tf
        run: |
          echo "sa=$(terraform output -raw storage_account_name)" >> "$GITHUB_OUTPUT"
          echo "url=$(terraform output -raw site_url)" >> "$GITHUB_OUTPUT"
      - name: Stamp commit SHA into the page
        working-directory: .
        run: sed -i "s/__COMMIT_SHA__/${{ github.sha }}/" site/index.html
      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Upload website
        working-directory: .
        run: >
          az storage blob upload-batch
          --account-name ${{ steps.tf.outputs.sa }}
          --destination '$web'
          --source site
          --overwrite
          --auth-mode login
      - name: Show URL
        run: echo "Site is live at ${{ steps.tf.outputs.url }}"
